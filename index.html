<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMORABK / SHAHM - PS4 HOST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f17;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .glow-bg {
      position: absolute;
      width: 350px; height: 350px;
      background: linear-gradient(45deg, #ff007f, #00f0ff);
      filter: blur(140px); border-radius: 50%; z-index: 1;
    }
    .container {
      position: relative; z-index: 2;
      background: rgba(20, 24, 38, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; padding: 40px; text-align: center;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
      max-width: 500px; width: 90%;
    }
    h1 {
      font-size: 2.3rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #ff007f, 0 0 42px #ff007f;
      margin-bottom: 10px;
    }
    .subtitle { font-size: 1.1rem; color: #00f0ff; margin-bottom: 25px; }
    .btn-jb {
      background: linear-gradient(45deg, #ff007f, #00f0ff);
      border: none; padding: 15px 30px; font-size: 1.2rem;
      font-weight: bold; color: #fff; border-radius: 12px;
      cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      margin-bottom: 20px; width: 100%; text-transform: uppercase;
      transition: 0.2s;
    }
    .btn-jb:active { transform: scale(0.98); }
    .status { font-size: 1rem; color: #00f0ff; margin-top: 10px; font-weight: bold; }
    .insta-box {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 0, 127, 0.4);
      padding: 10px 20px; border-radius: 50px; text-decoration: none;
      color: #ff007f; font-weight: 600; margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="container">
    <h1>AMORABK / SHAHM</h1>
    <div class="subtitle">PS4 9.00 Jailbreak Host</div>
    
    <button class="btn-jb" id="jbBtn" onclick="runJailbreak()">تفعيل الثغرة</button>
    <div class="status" id="statusText">جاهز للتشغيل</div>

    <br>
    <a href="https://instagram.com/amora_baker78" target="_blank" class="insta-box">
      <span>📷 instagram: amora_baker78</span>
    </a>
  </div>

  <script>
    function runJailbreak() {
      document.getElementById('jbBtn').style.display = 'none';
      document.getElementById('statusText.innerText = "جاري تحميل وحقن الثغرة...";';
      
      setTimeout(function() {
        var s = document.createElement('script');
        s.src = "psfree.mjs";
        s.type = "module";
        document.body.appendChild(s);
      }, 500);
    }
  </script>
</body>
</html>
